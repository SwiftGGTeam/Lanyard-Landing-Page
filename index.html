<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lanyard - SwiftGG</title>
  <meta name="description" content="Lanyard is the digital business card for iOS developers. Show who you are and what you build." />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="apple-touch-icon" href="assets/icon.png" />

  <!-- Figtree -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #16161a;
      --muted: #9a9aa2;
      --hairline: rgba(0, 0, 0, 0.09);
      --page-bg: #fcfaff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;     /* fallback for older browsers */
      min-height: 100lvh;    /* fill the FULL screen so the hand reaches the
                                physical bottom, tucking under Safari's bottom bar */
      padding-top: env(safe-area-inset-top);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ---------- Brand lockup ---------- */
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 24px 0 12px;
      z-index: 5;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 9px;
    }
    .brand .wordmark {
      font-weight: 700;            /* Figtree Bold */
      font-size: 25px;
      letter-spacing: -0.02em;
    }

    /* ---------- Stage : mockup + call to action ---------- */
    .stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column-reverse;   /* mobile: text on top, image below */
      align-items: center;
    }
    /* Image keeps its native aspect ratio (never distorted); on mobile it
       fills the remaining height and sits flush with the bottom of the screen */
    .device {
      display: block;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      object-fit: contain;
      object-position: center bottom;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ---------- Call to action ---------- */
    .cta {
      flex: 0 0 auto;
      width: 100%;
      max-width: 340px;
      margin: 16px auto 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .slogan {
      font-weight: 600;
      font-size: 21px;
      line-height: 1.3;
      color: var(--ink);
      letter-spacing: -0.015em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-weight: 400;
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 18px;
      letter-spacing: 0.005em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 500;
      font-size: 15.5px;
      letter-spacing: 0.005em;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .25s ease, background .2s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 19px; height: 19px; flex: none; }

    /* Primary — download iOS (placeholder) */
    .btn-primary {
      background: var(--ink);
      color: #fff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .16);
    }
    .btn-primary[aria-disabled="true"] { cursor: default; }
    .btn-primary:hover { box-shadow: 0 12px 30px rgba(0, 0, 0, .2); }
    .btn-primary .pill {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .18);
    }

    /* Secondary — web version */
    .btn-secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--hairline);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .05);
    }
    .btn-secondary:hover { border-color: rgba(0, 0, 0, .18); }

    /* ===================================================== */
    /*  Desktop : image full height, CTA to the right of wrist */
    /* ===================================================== */
    @media (min-width: 768px) {
      body { justify-content: center; }

      .brand {
        position: fixed;
        top: 36px;
        left: 44px;
        padding: 0;
      }

      .stage {
        height: 100vh;
        width: fit-content;
        flex-direction: row;
        align-items: stretch;
        margin: 0 auto;
      }
      .device {
        flex: 0 0 auto;
        height: 100vh;
        width: auto;
        max-width: none;
        object-fit: fill;
      }

      .cta {
        position: absolute;
        left: 72%;
        top: 75%;
        transform: translateY(-50%);
        width: 300px;
        max-width: none;
        margin: 0;
        text-align: left;
      }
      .slogan {
        font-size: 25px;
        margin-bottom: 7px;
      }
    }
  </style>
</head>
<body>

    <span class="wordmark">Lanyard</span>
  </header>
